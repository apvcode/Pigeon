name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            command: npm run build:linux -- --publish never
            artifact: |
              dist/*.AppImage
              dist/latest-linux.yml
          - platform: Windows
            os: windows-latest
            command: npm run build:win -- --publish never
            artifact: |
              dist/Pigeon-Setup.exe
              dist/Pigeon-Setup.exe.blockmap
              dist/latest.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: ${{ matrix.command }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: pigeon-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and attach packages
        uses: softprops/action-gh-release@v3
        with:
          name: Pigeon ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: release-assets/*
