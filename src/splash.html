<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pigeon</title>
  <style>
    :root {
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --surface: #060607;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; }
    body {
      display: grid;
      place-items: center;
      color: #f8fafc;
      background: linear-gradient(180deg, #07080a 0%, var(--surface) 58%, #040507 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 360ms var(--ease-out), filter 360ms var(--ease-out);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 25%, rgba(0, 0, 0, .34) 100%);
    }
    .ambient {
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      pointer-events: none;
      display: none;
    }
    .splash-card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(360px, calc(100vw - 48px));
      animation: card-enter 700ms var(--ease-out) both;
      transition: opacity 320ms var(--ease-out), translate 320ms var(--ease-out), scale 320ms var(--ease-out);
    }
    .logo-stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 132px;
      height: 132px;
      margin-bottom: 20px;
    }
    .logo-stage::before,
    .logo-stage::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .logo-stage::before {
      inset: 3px;
      padding: 1px;
      opacity: 0;
      background: conic-gradient(from 215deg, transparent 0 36%, rgba(255, 255, 255, .28) 48%, rgba(255, 255, 255, .08) 58%, transparent 68% 100%);
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      -webkit-mask: linear-gradient(#000 0 0) content-box xor, linear-gradient(#000 0 0);
      animation: ring-enter 900ms var(--ease-out) 180ms forwards, ring-turn 5s linear 1.08s infinite;
    }
    .logo-stage::after {
      inset: 24px;
      display: none;
    }
    .logo-svg {
      position: relative;
      z-index: 1;
      width: 88px;
      height: 88px;
      overflow: visible;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, .38));
    }
    .pixel {
      fill: #f8fafc;
      opacity: 0;
      translate: var(--pixel-x, 0) var(--pixel-y, 10px);
      scale: .68;
      animation: pixel-settle 520ms var(--ease-out) var(--pixel-delay, 0ms) forwards;
    }
    .signal-halo {
      fill: rgba(239, 68, 68, .2);
      opacity: 0;
      transform-origin: 410px 102px;
      animation: signal-halo 2.2s ease-out 620ms infinite;
    }
    .signal-core {
      fill: #ef4444;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, .88));
      opacity: 0;
      animation: signal-on 380ms var(--ease-out) 540ms forwards;
    }
    .signal-glint {
      fill: #fff;
      opacity: 0;
      animation: signal-on 300ms var(--ease-out) 650ms forwards;
    }
    .brand-title {
      margin-left: .58em;
      color: #f1f5f9;
      font-size: 16px;
      font-weight: 680;
      letter-spacing: .58em;
      text-transform: uppercase;
      text-shadow: 0 0 24px rgba(255, 255, 255, .13);
      opacity: 0;
      translate: 0 7px;
      animation: title-enter 560ms var(--ease-out) 420ms forwards;
    }
    .status {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 206px;
      margin-top: 27px;
      opacity: 0;
      animation: caption-enter 450ms ease 760ms forwards;
    }
    .progress-track {
      position: relative;
      width: 100%;
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, .09);
    }
    .progress-track::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 -42%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .82) 62%, transparent);
      animation: progress-travel 1.25s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    .connecting-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      color: #818388;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .21em;
      text-transform: uppercase;
    }
    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #a0a2a6;
      animation: status-pulse 1.35s ease-in-out infinite;
    }
    .x-logo {
      width: 11px;
      height: 11px;
      margin-left: -2px;
      fill: #e2e8f0;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, .22));
    }
    html.is-leaving body { opacity: 0; filter: blur(3px); }
    html.is-leaving .splash-card { opacity: 0; translate: 0 -5px; scale: .985; }
    @keyframes card-enter {
      from { opacity: 0; translate: 0 9px; scale: .985; }
      to { opacity: 1; translate: 0 0; scale: 1; }
    }
    @keyframes ring-enter {
      from { opacity: 0; scale: .84; rotate: -18deg; }
      to { opacity: 1; scale: 1; rotate: 0deg; }
    }
    @keyframes ring-turn { to { rotate: 360deg; } }
    @keyframes pixel-settle {
      0% { opacity: 0; }
      65% { opacity: 1; translate: 0 0; scale: 1.09; }
      100% { opacity: 1; translate: 0 0; scale: 1; }
    }
    @keyframes signal-on {
      from { opacity: 0; scale: .5; }
      to { opacity: 1; scale: 1; }
    }
    @keyframes signal-halo {
      0% { opacity: 0; scale: .75; }
      20% { opacity: .75; }
      72%, 100% { opacity: 0; scale: 1.65; }
    }
    @keyframes title-enter { to { opacity: 1; translate: 0 0; } }
    @keyframes caption-enter {
      from { opacity: 0; translate: 0 4px; }
      to { opacity: 1; translate: 0 0; }
    }
    @keyframes progress-travel {
      0% { translate: 0 0; }
      100% { translate: 338% 0; }
    }
    @keyframes status-pulse {
      0%, 100% { opacity: .42; scale: .82; }
      50% { opacity: 1; scale: 1; }
    }
    html.reduced-motion *,
    html.reduced-motion *::before,
    html.reduced-motion *::after {
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="splash-card" aria-label="Pigeon is starting">
    <div class="logo-stage" aria-hidden="true">
      <svg class="logo-svg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect class="pixel" style="--pixel-x:0;--pixel-y:-18px;--pixel-delay:70ms" x="236" y="120" width="40" height="40" rx="8"/>
        <rect class="pixel" style="--pixel-x:-15px;--pixel-y:-8px;--pixel-delay:130ms" x="180" y="180" width="40" height="40" rx="8"/>
        <rect class="pixel" style="--pixel-x:0;--pixel-y:-10px;--pixel-delay:170ms" x="236" y="180" width="40" height="40" rx="8"/>
        <rect class="pixel" style="--pixel-x:15px;--pixel-y:-8px;--pixel-delay:210ms" x="292" y="180" width="40" height="40" rx="8"/>
        <rect class="pixel" style="--pixel-x:-18px;--pixel-y:0;--pixel-delay:250ms" x="124" y="240" width="40" height="40" rx="8"/>
        <rect class="pixel" style="--pixel-x:0;--pixel-y:0;--pixel-delay:290ms" x="236" y="240" width="40" height="40" rx="8"/>
        <rect class="pixel" style="--pixel-x:18px;--pixel-y:0;--pixel-delay:330ms" x="348" y="240" width="40" height="40" rx="8"/>
        <rect class="pixel" style="--pixel-x:0;--pixel-y:14px;--pixel-delay:370ms" x="236" y="300" width="40" height="40" rx="8"/>
        <rect class="pixel" style="--pixel-x:0;--pixel-y:18px;--pixel-delay:410ms" x="236" y="360" width="40" height="40" rx="8"/>
        <circle class="signal-halo" cx="410" cy="102" r="34"/>
        <circle class="signal-core" cx="410" cy="102" r="25"/>
        <circle class="signal-glint" cx="410" cy="102" r="9"/>
      </svg>
    </div>
    <h1 class="brand-title">Pigeon</h1>
    <div class="status" role="status" aria-live="polite">
      <div class="progress-track"></div>
      <div class="connecting-row">
        <span class="status-dot"></span>
        <span>Connecting to</span>
        <svg class="x-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-label="X">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </div>
    </div>
  </main>
</body>
</html>
