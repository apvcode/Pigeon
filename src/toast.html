<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .toast-card {
      margin: 4px;
      height: calc(100% - 8px);
      background: rgba(18, 18, 18, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 12px;
      cursor: pointer;
      position: relative;
      transform: translateX(40px);
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, background 0.2s;
    }
    .toast-card.show {
      transform: translateX(0);
      opacity: 1;
    }
    .toast-card:hover {
      border-color: rgba(29, 155, 240, 0.5);
      background: rgba(26, 26, 26, 0.98);
    }
    .toast-card.reduced-motion {
      transition-duration: 1ms;
    }
    .toast-progress {
      position: absolute;
      right: 14px;
      bottom: 5px;
      left: 14px;
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
    }
    .toast-progress::after {
      display: block;
      width: 100%;
      height: 100%;
      content: "";
      transform-origin: left center;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
    }
    .toast-progress.running::after {
      animation: toast-countdown var(--toast-duration, 5500ms) linear forwards;
    }
    .toast-progress.paused::after {
      animation-play-state: paused;
    }
    @keyframes toast-countdown {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      display: none;
    }
    .avatar-placeholder {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #27272a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }
    .content {
      flex: 1;
      min-width: 0;
    }
    .sender {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .text {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .close-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
    }
    .close-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="toast-card" id="toast-card">
    <img class="avatar" id="toast-avatar-img" />
    <div class="avatar-placeholder" id="toast-avatar-placeholder">X</div>
    <div class="content">
      <div class="sender" id="toast-sender">Pigeon</div>
      <div class="text" id="toast-text">New message</div>
    </div>
    <div class="close-btn" id="toast-close">✕</div>
    <div class="toast-progress" id="toast-progress"></div>
  </div>
</body>
</html>
